services:
  # Local Ollama - strictly uses your personal PC's RAM & CPU/GPU
  ollama:
    image: ollama/ollama:latest
    container_name: local_llm_engine
    ports:
      - "11434:11434"
    volumes:
      - ./local_ollama_weights:/root/.ollama
    restart: unless-stopped

  # Local Edge Orchestrator
  # Connects back to AWS Postgres (shared state/audit), but executes inference on local RAM
  local_orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local_ai_orchestrator
    ports:
      - "8001:8000"
    environment:
      - DEPLOYMENT_ENV=local_hardware
      - DB_HOST=${AWS_POSTGRES_HOST}
      - DB_PORT=${AWS_POSTGRES_PORT:-5432}
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-app_db}
      - DB_SSLMODE=prefer
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - LOCAL_MODEL_NAME=${LOCAL_MODEL_NAME:-qwen2.5:7b}
      - CLOUD_API_KEY=${CLOUD_API_KEY:-}
      - CLOUD_GATEWAY_URL=${CLOUD_GATEWAY_URL:-https://api.groq.com/openai/v1}
      - CLOUD_MODEL_NAME=${CLOUD_MODEL_NAME:-llama-3.3-70b-versatile}
    depends_on:
      - ollama
    restart: unless-stopped
