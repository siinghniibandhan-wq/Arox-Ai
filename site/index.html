    h = kv("Database", d.database) + kv("Redis", d.redis) + kv("Pending approvals", d.pending) + kv("Agents", d.agents) + kv("Skills", d.skills) + kv("Chat today", d.chat_used_today + " / " + d.chat_daily_limit);
  } else {
    if (n == "activity" && td) d = d.filter(function(x){ return new Date(x.created_at).toDateString() == new Date().toDateString(); });
    if (n == "approvals") h = '<button class="ghost tg" onclick="togAll()">' + (apAll ? "Show pending only" : "Show all") + '</button>';
    if (!d.length) h += "<p>Nothing to show.</p>";
    d.forEach(function(x){
      if (n == "agents") h += item('<b>' + e2(x.name) + '</b>' + (x.is_active ? "" : " (inactive)"), e2(x.job) + '<br>Skills: ' + e2((x.skills || []).join(", ") || "none"));
      else if (n == "skills") h += item('<b>' + e2(x.name) + '</b> v' + e2(x.version), e2(x.description));
      else if (n == "activity") h += item('<b>' + e2(x.action) + '</b>', e2(when(x.created_at)) + ' · ' + e2(x.actor) + (x.target ? ' · ' + e2(x.target) : '') + (x.after ? '<br>' + e2(x.after) : ''));
      else h += item('<b>' + e2(x.tool) + '</b> · Level ' + e2(x.level) + ' · ' + e2(x.status), e2(x.requester) + ' · ' + e2(when(x.created_at)) + (x.args ? '<br>' + e2(x.args) : ''));
    });
  }
  box.innerHTML = h;
}
$("q1").onclick = function(){ apAll = 0; tab("approvals"); };
$("q2").onclick = function(){ actToday = true; tab("activity"); };
$("q3").onclick = function(){ tab("status"); };
