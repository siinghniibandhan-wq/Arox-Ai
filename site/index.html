<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1419">
<link rel="manifest" href="/manifest.json">
<title>Arox</title>
<style>
:root{--bg:#0e1419;--panel:#161e26;--line:#25313c;--text:#e6edf3;--mute:#8b9bab;--acc:#46d1b5;--ink:#04231d;--err:#ff7b72}
@media(prefers-color-scheme:light){:root{--bg:#f3f6f8;--panel:#fff;--line:#d9e1e7;--text:#14202a;--mute:#5d6d7b;--acc:#0f9d84;--ink:#fff;--err:#c62828}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mark{width:36px;height:36px;border-radius:12px;background:var(--acc);color:var(--ink);display:grid;place-items:center;font-weight:700}
header h1{font-size:17px;margin:0;line-height:1.2}
header small{color:var(--mute);display:block;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px}
.ghost{margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mute)}
#login{flex:1;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 24px}
.card h2{margin:16px 0 4px;font-size:24px}
.card p{margin:0 0 20px;color:var(--mute)}
.field{position:relative;margin-bottom:12px}
.field input{width:100%;padding:14px 64px 14px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.field button{position:absolute;right:6px;top:6px;bottom:6px;padding:0 10px;background:none;color:var(--mute);border-radius:8px}
.primary{width:100%;padding:14px;border-radius:12px;background:var(--acc);color:var(--ink);font-weight:600}
.primary:active,.send:active{transform:scale(.97)}
#err{color:var(--err);min-height:1.4em;margin-top:10px;font-size:14px}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{max-width:min(86%,640px);display:flex;flex-direction:column;gap:4px}
.msg.u{align-self:flex-end;align-items:flex-end}
.bub{padding:10px 14px;border-radius:18px;word-break:break-word}
.u .bub{background:var(--acc);color:var(--ink);border-bottom-right-radius:6px;white-space:pre-wrap}
.b .bub{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.bub ul{margin:4px 0 8px;padding-left:20px}
.bub code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:.9em}
.tw{overflow-x:auto;margin:6px 0}
.bub table{border-collapse:collapse;font-size:14px}
.bub th,.bub td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.meta{font-size:12px;color:var(--mute);display:flex;gap:10px;align-items:center}
.meta button{background:none;color:var(--mute);padding:2px 4px;font-size:12px}
.empty{margin:auto;text-align:center;max-width:420px}
.empty h2{font-size:22px;margin:0 0 6px}
.empty p{color:var(--mute);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:14px}
.chip:hover{border-color:var(--acc)}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.comp{display:flex;gap:8px;align-items:flex-end;padding:10px 12px 12px;border-top:1px solid var(--line)}
.comp textarea{flex:1;resize:none;max-height:140px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--panel);line-height:1.4}
.send{width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--ink);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div id="login">
<form class="card" id="lf">
<div class="mark">A</div>
<h2>Welcome back</h2>
<p>Sign in to your Chief of Staff.</p>
<div class="field"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
<button type="button" id="eye">Show</button></div>
<button class="primary" id="go" type="submit">Sign in</button>
<div id="err" role="alert"></div>
</form>
</div>
<div id="app" class="hide">
<header><div class="mark">A</div>
<div><h1>Chief of Staff</h1><small><span class="dot"></span><span id="st">Online</span></small></div>
<select id="rt" aria-label="Route" style="background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:4px 6px;font-size:12px;margin-left:auto"><option value="">Default</option><option value="direct">Direct</option><option value="smart">Smart</option><option value="auto">Auto</option></select>
<button class="ghost" id="out">Sign out</button></header>
<div id="log"></div>
<div class="comp"><textarea id="msg" rows="1" placeholder="Ask or give a task"></textarea>
<button class="send" id="send" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
</div>
<script>
try { var _rt = sessionStorage.getItem("rt"); if (_rt) document.addEventListener("DOMContentLoaded", function () { $("rt").value = _rt; }); } catch (e) {}
var T = null, busy = false;
try { T = sessionStorage.getItem("t"); } catch (e) {}
function $(i){return document.getElementById(i);}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  s = esc(s.replace(/<br\s*\/?>/gi, " "));
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}
function table(rows){
  var h = "<div class='tw'><table>";
  rows.forEach(function(r, k){
    if (/^[\s|:-]+$/.test(r)) return;
    var c = r.trim().replace(/^\||\|$/g, "").split("|");
    var tag = k == 0 ? "th" : "td";
    h += "<tr>" + c.map(function(x){
      return "<" + tag + ">" + inline(x.trim()) + "</" + tag + ">";
    }).join("") + "</tr>";
  });
  return h + "</table></div>";
}
function md(src){
  var L = src.replace(/\r/g, "").split("\n"), out = [], i = 0, ul = false;
  function close(){ if (ul) { out.push("</ul>"); ul = false; } }
  while (i < L.length) {
    var l = L[i];
    if (/^\s*\|.*\|\s*$/.test(l)) {
      close();
      var rows = [];
      while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) { rows.push(L[i]); i++; }
      out.push(table(rows));
      continue;
    }
    var m = l.match(/^\s*[-*•]\s+(.*)/);
    if (m) {
      if (!ul) { out.push("<ul>"); ul = true; }
      out.push("<li>" + inline(m[1]) + "</li>");
    } else if (/^\s*#{1,6}\s+/.test(l)) {
      close(); out.push("<p><b>" + inline(l.replace(/^\s*#{1,6}\s+/, "")) + "</b></p>");
    } else if (l.trim() && !/^\s*(-{3,}|\*{3,})\s*$/.test(l)) {
      close(); out.push("<p>" + inline(l) + "</p>");
    } else close();
    i++;
  }
  close();
  return out.join("");
}
function now(){ return new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}); }
function down(){ var g = $("log"); g.scrollTop = g.scrollHeight; }
function add(role, text){
  var e = $("empty"); if (e) e.remove();
  var d = document.createElement("div");
  d.className = "msg " + role;
  var b = document.createElement("div");
  b.className = "bub";
  if (role == "u") b.textContent = text; else b.innerHTML = md(text);
  var m = document.createElement("div");
  m.className = "meta";
  m.textContent = now();
  d.appendChild(b); d.appendChild(m);
  if (role == "b") {
    var c = document.createElement("button");
    c.textContent = "Copy";
    c.onclick = function(){
      try { navigator.clipboard.writeText(text); c.textContent = "Copied"; } catch (x) {}
      setTimeout(function(){ c.textContent = "Copy"; }, 1500);
    };
    m.appendChild(c);
  }
  $("log").appendChild(d); down();
}
function empty(){
  var d = document.createElement("div");
  d.className = "empty"; d.id = "empty";
  d.innerHTML = "<h2>What should we work on?</h2><p>I draft and plan. Nothing is sent, paid or deployed without your approval.</p><div class='chips'></div>";
  ["Plan this month's GST summary", "Draft a follow-up to a late-paying client", "What should I focus on today?"].forEach(function(t){
    var b = document.createElement("button");
    b.className = "chip"; b.textContent = t;
    b.onclick = function(){ $("msg").value = t; send(); };
    d.lastChild.appendChild(b);
  });
  $("log").appendChild(d);
}
function typing(on){
  var t = $("tp");
  if (!on) { if (t) t.remove(); return; }
  var d = document.createElement("div");
  d.id = "tp"; d.className = "msg b";
  d.innerHTML = "<div class='bub typing'><i></i><i></i><i></i></div>";
  $("log").appendChild(d); down();
}
async function post(path, body, tok){
  var h = {"Content-Type": "application/json"};
  if (tok) h["X-Session"] = tok;
  var r;
  try { r = await fetch(path, {method: "POST", headers: h, body: JSON.stringify(body || {})}); }
  catch (e) { return {ok: false, status: 0, j: {}}; }
  var j = {};
  try { j = await r.json(); } catch (e) {}
  return {ok: r.ok, status: r.status, j: j};
}
function keep(t){
  T = t;
  try { if (t) sessionStorage.setItem("t", t); else sessionStorage.removeItem("t"); } catch (e) {}
}
function show(){
  $("login").classList.toggle("hide", !!T);
  $("app").classList.toggle("hide", !T);
  if (T && !$("log").children.length) empty();
}
async function login(ev){
  ev.preventDefault();
  $("err").textContent = ""; $("go").disabled = true; $("go").textContent = "Signing in…";
  var r = await post("/login", {password: $("pw").value});
  $("go").disabled = false; $("go").textContent = "Sign in";
  $("pw").value = "";
  if (r.ok) { keep(r.j.token); show(); }
  else $("err").textContent = r.status == 429 ? "Too many attempts. Try again in 15 minutes." : r.status == 0 ? "Can't reach the server. Check your connection." : "Wrong password. Check it and try again.";
}
function grow(){
  var m = $("msg"); m.style.height = "auto";
  m.style.height = Math.min(m.scrollHeight, 140) + "px";
}
async function send(){
  var t = $("msg").value.trim();
  if (!t || busy) return;
  busy = true; $("send").disabled = true;
  $("msg").value = ""; grow();
  add("u", t); typing(true);
  var rt = $("rt").value; try { sessionStorage.setItem("rt", rt); } catch (e) {}
  var r = await post("/chat", {message: t, route: rt}, T);
  typing(false);
  if (r.status == 401) { keep(null); $("err").textContent = "Session ended. Sign in again."; show(); }
  else if (r.ok) {
    add("b", r.j.reply);
    $("st").textContent = (r.j.engine_used || "").replace(/^.*\(|\)$/g, "") || "Online";
  } else add("b", "That didn't go through (error " + r.status + "). Send it again.");
  busy = false; $("send").disabled = false; $("msg").focus();
}
function out(){
  var t = T; keep(null); $("log").innerHTML = ""; $("st").textContent = "Online"; show();
  post("/logout", {}, t);
}
$("lf").onsubmit = login;
$("send").onclick = send;
$("out").onclick = out;
$("msg").oninput = grow;
$("msg").onkeydown = function(e){
  if (e.key == "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
};
$("eye").onclick = function(){
  var p = $("pw"), s = p.type == "password";
  p.type = s ? "text" : "password"; this.textContent = s ? "Hide" : "Show";
};
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
show();
</script></body></html>
