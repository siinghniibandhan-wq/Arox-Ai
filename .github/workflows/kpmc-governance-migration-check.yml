name: KPMC governance migration check

on:
  pull_request:
    branches: [main]
    paths:
      - "migrations/**"
      - "tests/**"
      - ".github/workflows/kpmc-governance-migration-check.yml"
  workflow_dispatch:

jobs:
  governance-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: app_db
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply migration and verify idempotency, role grants and immutable history
        run: bash tests/test_migration_023.sh
